apiVersion: v1
kind: ConfigMap

metadata:
  name: pedidos-k6-script
  namespace: {{ .Values.global.namespace }}

data:
  test.js: |
    import http from 'k6/http';
    import { check } from 'k6';

    export const options = {
      vus: 3,
      duration: '10s',
      thresholds: {
        http_req_failed: ['rate<0.05'],
        http_req_duration: ['p(95)<1000'],
        checks: ['rate>0.95'],
      },
    };

    export default function () {
      const url = 'http://servicio-pedidos-canary:3005/graphql';

      const payload = JSON.stringify({
        query: '{ __typename }',
      });

      const params = {
        headers: {
          'Content-Type': 'application/json',
        },
      };

      const response = http.post(url, payload, params);

      check(response, {
        'status HTTP 200': (r) => r.status === 200,
        'GraphQL devuelve data': (r) => r.body.includes('"data"'),
        'GraphQL no devuelve errors': (r) => !r.body.includes('"errors"'),
      });
    }

---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate

metadata:
  name: pedidos-smoke
  namespace: {{ .Values.global.namespace }}

spec:
  metrics:
    - name: smoke-health-canary

      provider:
        job:
          spec:
            backoffLimit: 0

            template:
              metadata:
                labels:
                  app: pedidos-analysis
                  analysis: smoke

              spec:
                restartPolicy: Never
                automountServiceAccountToken: false

                containers:
                  - name: smoke

                    image: python:3.12-alpine
                    imagePullPolicy: IfNotPresent

                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 65532
                      runAsGroup: 65532
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL

                    resources:
                      requests:
                        cpu: 10m
                        memory: 32Mi
                      limits:
                        cpu: 100m
                        memory: 128Mi

                    command:
                      - python
                      - -c

                    args:
                      - |
                        import json
                        import urllib.request

                        url = "http://servicio-pedidos-canary:3005/health"

                        with urllib.request.urlopen(url, timeout=5) as response:
                            assert response.status == 200
                            body = json.loads(response.read().decode())

                        assert body.get("servicio") == "servicio_pedidos"
                        assert body.get("estado") == "activo"

                        print("SMOKE OK:", body)

---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate

metadata:
  name: pedidos-integration
  namespace: {{ .Values.global.namespace }}

spec:
  metrics:
    - name: integration-graphql-canary

      provider:
        job:
          spec:
            backoffLimit: 0

            template:
              metadata:
                labels:
                  app: pedidos-analysis
                  analysis: integration

              spec:
                restartPolicy: Never
                automountServiceAccountToken: false

                containers:
                  - name: integration

                    image: python:3.12-alpine
                    imagePullPolicy: IfNotPresent

                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 65532
                      runAsGroup: 65532
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL

                    resources:
                      requests:
                        cpu: 10m
                        memory: 32Mi
                      limits:
                        cpu: 100m
                        memory: 128Mi

                    command:
                      - python
                      - -c

                    args:
                      - |
                        import json
                        import urllib.request

                        url = "http://servicio-pedidos-canary:3005/graphql"

                        payload = json.dumps({
                            "query": "{ __typename }"
                        }).encode()

                        request = urllib.request.Request(
                            url,
                            data=payload,
                            headers={"Content-Type": "application/json"},
                            method="POST",
                        )

                        with urllib.request.urlopen(request, timeout=10) as response:
                            assert response.status == 200
                            body = json.loads(response.read().decode())

                        assert "data" in body
                        assert not body.get("errors")
                        assert body["data"].get("__typename")

                        print("INTEGRATION OK:", body)

---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate

metadata:
  name: pedidos-k6
  namespace: {{ .Values.global.namespace }}

spec:
  metrics:
    - name: k6-load-canary

      provider:
        job:
          spec:
            backoffLimit: 0

            template:
              metadata:
                labels:
                  app: pedidos-analysis
                  analysis: k6

              spec:
                restartPolicy: Never
                automountServiceAccountToken: false

                containers:
                  - name: k6

                    image: grafana/k6:0.54.0
                    imagePullPolicy: IfNotPresent

                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 65532
                      runAsGroup: 65532
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL

                    env:
                      - name: HOME
                        value: /tmp

                    resources:
                      requests:
                        cpu: 50m
                        memory: 64Mi
                      limits:
                        cpu: 250m
                        memory: 256Mi

                    command:
                      - k6

                    args:
                      - run
                      - /scripts/test.js

                    volumeMounts:
                      - name: k6-script
                        mountPath: /scripts
                        readOnly: true

                volumes:
                  - name: k6-script
                    configMap:
                      name: pedidos-k6-script
