image:
  repository: postgres
  tag: "16-alpine"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  port: 5432

persistence:
  storageClassName: gp3
  size: 1Gi

resources:
  requests:
    cpu: 100m
    memory: 128Mi

  limits:
    cpu: 300m
    memory: 512Mi

# Valores por defecto para validación independiente del chart.
# El chart padre sobrescribe estos valores durante el despliegue.
global:
  namespace: default
  config: {}
