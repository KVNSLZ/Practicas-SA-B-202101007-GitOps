apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: postgresql
  namespace: {{ .Values.global.namespace }}

  labels:
    app: postgresql

spec:
  serviceName: postgresql-headless

  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: postgresql

  template:
    metadata:
      labels:
        app: postgresql

      annotations:
        checksum/config: {{ toJson .Values.global.config.database | sha256sum | quote }}

    spec:
      containers:
        - name: postgresql

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: postgresql
              containerPort: 5432

          env:
            # Nombre de la base
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ printf "%s-sa-platform-config" .Release.Name }}
                  key: DB_NAME

            # Usuario
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ printf "%s-sa-platform-config" .Release.Name }}
                  key: DB_USER

            # Contraseña
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-sa-platform-secret" .Release.Name }}
                  key: DB_PASSWORD

            # Evita problemas al montar directamente el volumen
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          volumeMounts:

            # Datos persistentes
            - name: data
              mountPath: /var/lib/postgresql/data

            # Scripts SQL
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

      volumes:

        - name: init-scripts
          configMap:
            name: {{ .Release.Name }}-postgresql-init

  volumeClaimTemplates:

    - metadata:
        name: data

      spec:
        accessModes:
          - ReadWriteOnce

        storageClassName: {{ .Values.persistence.storageClassName | quote }}

        resources:
          requests:
            storage: {{ .Values.persistence.size }}
