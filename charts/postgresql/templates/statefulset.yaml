apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: postgresql
  namespace: {{ .Values.global.namespace }}

  labels:
    app: postgresql

spec:
  serviceName: postgresql-headless

  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: postgresql

  template:
    metadata:
      labels:
        app: postgresql

      annotations:
        pre.hook.backup.velero.io/container: postgresql
        pre.hook.backup.velero.io/command: '["/bin/sh","-ec","mkdir -p /var/lib/postgresql/data/dr; pg_dump -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -Fc -f /var/lib/postgresql/data/dr/database.dump; date -u +%Y-%m-%dT%H:%M:%SZ > /var/lib/postgresql/data/dr/dump-time.txt"]'
        pre.hook.backup.velero.io/on-error: Fail
        pre.hook.backup.velero.io/timeout: 120s
        checksum/config: {{ toJson .Values.global.config.database | sha256sum | quote }}

    spec:
      containers:
        - name: postgresql

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: postgresql
              containerPort: 5432

          env:
            # Nombre de la base
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ printf "%s-sa-platform-config" .Release.Name }}
                  key: DB_NAME

            # Usuario
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ printf "%s-sa-platform-config" .Release.Name }}
                  key: DB_USER

            # Contraseña
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-sa-platform-secret" .Release.Name }}
                  key: DB_PASSWORD

            # Evita problemas al montar directamente el volumen
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          startupProbe:
            exec:
              command: ["sh", "-ec", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["sh", "-ec", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-ec", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:

            # Datos persistentes
            - name: data
              mountPath: /var/lib/postgresql/data

            # Scripts SQL
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

      volumes:

        - name: init-scripts
          configMap:
            name: {{ .Release.Name }}-postgresql-init

  volumeClaimTemplates:

    - metadata:
        name: data

      spec:
        accessModes:
          - ReadWriteOnce

        storageClassName: {{ .Values.persistence.storageClassName | quote }}

        resources:
          requests:
            storage: {{ .Values.persistence.size }}
